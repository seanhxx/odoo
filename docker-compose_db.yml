version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_odoo_17
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres_odoo_17
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_17:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network

volumes:
  postgres_data_17:
    driver: local

networks:
  app_network:
    driver: bridge